name: Bug report
description: Report a reproducible defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to provide a reproducible report.
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: tensorflow
    attributes:
      label: TensorFlow version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / configuration
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and traceback
      render: shell
    validations:
      required: true
