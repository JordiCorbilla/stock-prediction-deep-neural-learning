name: CI

on:
  push:
    branches:
      - master
      - architecture-clean-up
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas pytest ruff

      - name: Compile Python sources
        run: python -m compileall -q quant_forecast_lab *.py

      - name: Lint maintained package and tests
        run: ruff check quant_forecast_lab tests

      - name: Run unit tests
        run: pytest

      - name: Smoke test research CLI
        run: |
          quant-forecast --help
          quant-forecast benchmark --help
          quant-forecast arena --help

  legacy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Import legacy entry points
        env:
          MPLBACKEND: Agg
        run: |
          python -c "import stock_prediction_deep_learning, stock_prediction_deep_learning_inference, stock_prediction_forecasting, stock_prediction_download_market_data, stock_prediction_download_market_data_info, stock_prediction_lstm, stock_prediction_numpy, stock_prediction_plotter, stock_prediction_readme_generator"
          python stock_prediction_deep_learning.py --help
          python stock_prediction_forecasting.py --help

      - name: Load reference v7 artifacts
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import json
          import tensorflow as tf

          folder = "examples/runs/reference-v7-ftse"
          with open(f"{folder}/model_config.json", encoding="utf-8") as handle:
              config = json.load(handle)
          assert config["model_version"] == "v7"

          direction = tf.keras.models.load_model(f"{folder}/model_direction.keras", compile=False)
          magnitude = tf.keras.models.load_model(f"{folder}/model_magnitude.keras", compile=False)
          assert direction.input_shape[1] == config["time_steps"]
          assert magnitude.input_shape[1] == config["time_steps"]
          PY

      - name: Verify exchange-session calendar
        run: |
          python - <<'PY'
          import pandas as pd
          from stock_prediction_deep_learning_inference import _future_dates

          dates = _future_dates(pd.Timestamp("2025-12-24"), 3, True, "XLON")
          assert len(dates) == 3
          assert pd.Timestamp("2025-12-25") not in dates
          assert pd.Timestamp("2025-12-26") not in dates
          assert pd.Timestamp("2025-12-29") in dates
          PY

      - name: Build and execute v8 model contract
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import numpy as np
          from stock_prediction_lstm import LongShortTermMemory

          x = np.zeros((8, 3, 1), dtype=np.float32)
          helper = LongShortTermMemory(".")
          model = helper.create_multitask_model(x)
          output = model.predict(x[:1], verbose=0)

          v6 = helper.create_model(x, version="v6", output_units=5)
          assert v6.output_shape == (None, 5)

          assert set(output) == {"direction", "magnitude"}
          assert output["direction"].shape == (1, 1)
          assert output["magnitude"].shape == (1, 1)
          assert 0.0 <= float(output["direction"][0, 0]) <= 1.0
          assert float(output["magnitude"][0, 0]) >= 0.0
          PY
