name: CI

on:
  push:
    branches:
      - master
      - architecture-clean-up
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy pandas pytest ruff

      - name: Compile Python sources
        run: python -m compileall -q stocklab *.py

      - name: Lint maintained package and tests
        run: ruff check stocklab tests

      - name: Run unit tests
        run: pytest
