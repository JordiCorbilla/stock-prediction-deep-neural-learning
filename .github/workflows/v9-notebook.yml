name: v9 Project Notebook

# Executed notebook commits do not retrigger this workflow; source changes do.

on:
  workflow_dispatch:
  push:
    branches:
      - architecture-clean-up
    paths:
      - stock_prediction_deep_learning.py
      - stock_prediction_deep_learning_inference.py
      - stock_prediction_lstm.py
      - stock_prediction_numpy.py
      - stock_prediction_plotter.py
      - quant_forecast_lab/config.py
      - examples/notebooks/stock_prediction_lstm_v9.ipynb
      - .github/workflows/v9-notebook.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: architecture-clean-up

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbformat nbconvert ipykernel
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Validate notebook structure
        run: |
          python - <<'PY'
          import nbformat
          path = "examples/notebooks/stock_prediction_lstm_v9.ipynb"
          notebook = nbformat.read(path, as_version=4)
          nbformat.validate(notebook)
          print(f"Validated {path}: {len(notebook.cells)} cells")
          PY

      - name: Execute project notebook top to bottom
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          jupyter nbconvert             --to notebook             --execute             --inplace             examples/notebooks/stock_prediction_lstm_v9.ipynb             --ExecutePreprocessor.timeout=2700             --ExecutePreprocessor.kernel_name=python3

      - name: Validate notebook and project outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import nbformat

          notebook_path = Path("examples/notebooks/stock_prediction_lstm_v9.ipynb")
          notebook = nbformat.read(notebook_path, as_version=4)
          nbformat.validate(notebook)

          code_cells = [
              cell for cell in notebook.cells
              if cell.cell_type == "code" and cell.source.strip()
          ]
          assert code_cells
          assert all(cell.execution_count is not None for cell in code_cells)
          errors = [
              output
              for cell in code_cells
              for output in cell.get("outputs", [])
              if output.output_type == "error"
          ]
          assert not errors, errors

          png_outputs = sum(
              1
              for cell in code_cells
              for output in cell.get("outputs", [])
              if output.output_type in {"display_data", "execute_result"}
              and "image/png" in output.get("data", {})
          )
          assert png_outputs >= 3, f"Expected project plots in notebook, found {png_outputs} PNG outputs"

          run_dirs = sorted(Path(".").glob("^FTSE_v9_*"))
          assert run_dirs, "v9 notebook did not create a project run folder"
          run_dir = run_dirs[-1]

          required = [
              "model_return_multitask.keras",
              "model_config.json",
              "return_forecast_metrics.json",
              "forecast_metrics.json",
              "future_predictions.csv",
              "v9_architecture.png",
          ]
          missing = [name for name in required if not (run_dir / name).exists()]
          assert not missing, f"Missing v9 project outputs: {missing}"

          config = json.loads((run_dir / "model_config.json").read_text())
          assert config["model_version"] == "v9"
          assert config["use_returns"] is True

          metrics = json.loads((run_dir / "return_forecast_metrics.json").read_text())
          assert "rmse_skill_vs_zero" in metrics
          assert "direction_accuracy" in metrics
          assert "q10_q90_coverage" in metrics

          print(f"Executed project folder: {run_dir}")
          print(f"Embedded PNG outputs: {png_outputs}")
          print(json.dumps(metrics, indent=2))
          PY

      - name: Render executed notebook
        run: |
          mkdir -p notebook-artifact
          jupyter nbconvert             --to html             examples/notebooks/stock_prediction_lstm_v9.ipynb             --output stock_prediction_lstm_v9.html             --output-dir notebook-artifact
          cp examples/notebooks/stock_prediction_lstm_v9.ipynb notebook-artifact/

          RUN_DIR=$(find . -maxdepth 1 -type d -name '^FTSE_v9_*' -print | sort | tail -1)
          cp "$RUN_DIR/model_config.json" notebook-artifact/
          cp "$RUN_DIR/return_forecast_metrics.json" notebook-artifact/
          cp "$RUN_DIR/forecast_metrics.json" notebook-artifact/
          cp "$RUN_DIR/future_predictions.csv" notebook-artifact/
          cp "$RUN_DIR/v9_architecture.png" notebook-artifact/
          cp "$RUN_DIR/"*"_prediction.png" notebook-artifact/ 2>/dev/null || true
          cp "$RUN_DIR/"*"_future_forecast.png" notebook-artifact/ 2>/dev/null || true

      - name: Commit executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f examples/notebooks/stock_prediction_lstm_v9.ipynb
          if git diff --cached --quiet; then
            echo "No executed notebook changes to commit."
          else
            git commit -m "Execute integrated v9 project notebook"
            git push origin HEAD:architecture-clean-up
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: v9-project-notebook
          path: notebook-artifact
          if-no-files-found: error
          retention-days: 30
