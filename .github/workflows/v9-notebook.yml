name: v9 Executed Notebook

on:
  workflow_dispatch:
  push:
    branches:
      - architecture-clean-up
    paths:
      - examples/notebooks/build_v9_notebook.py
      - .github/workflows/v9-notebook.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: architecture-clean-up

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and notebook tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbformat nbconvert ipykernel
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Generate notebook
        run: |
          python examples/notebooks/build_v9_notebook.py
          python - <<'PY'
          import nbformat
          path = "examples/notebooks/v9_return_forecasting.ipynb"
          nb = nbformat.read(path, as_version=4)
          nbformat.validate(nb)
          print(f"Validated {path}: {len(nb.cells)} cells")
          PY

      - name: Execute notebook top to bottom
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          jupyter nbconvert             --to notebook             --execute examples/notebooks/v9_return_forecasting.ipynb             --output v9_return_forecasting.ipynb             --output-dir examples/notebooks             --ExecutePreprocessor.timeout=1800             --ExecutePreprocessor.kernel_name=python3

      - name: Inject executed tl;dr
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import nbformat

          notebook = Path("examples/notebooks/v9_return_forecasting.ipynb")
          metrics = Path("reports/generated/v9-notebook/v9_spy_metrics.json")
          payload = json.loads(metrics.read_text())
          rows = {row["model"]: row for row in payload["forecast_metrics"]}
          zero = rows["Zero return"]
          ridge = rows["Ridge"]
          v9 = rows["v9 multi-task LSTM"]

          summary = "\n".join([
              "# v9 — Return-first multi-task forecasting",
              "",
              "## tl;dr — executed result",
              "",
              f"This notebook executed successfully on **{payload['test_samples']} held-out SPY sessions from {payload['test_start']} through {payload['test_end']}**.",
              "",
              "| Model | Return RMSE | RMSE skill vs zero | Direction | Delta IC |",
              "| --- | ---: | ---: | ---: | ---: |",
              f"| Zero return | {zero['return_rmse_pct']:.4f}% | 0.00% | {zero['direction_accuracy']:.2%} | — |",
              f"| Ridge | {ridge['return_rmse_pct']:.4f}% | {ridge['rmse_skill_vs_zero']:+.2%} | {ridge['direction_accuracy']:.2%} | {ridge['delta_ic']:.4f} |",
              f"| **v9 multi-task LSTM** | **{v9['return_rmse_pct']:.4f}%** | **{v9['rmse_skill_vs_zero']:+.2%}** | **{v9['direction_accuracy']:.2%}** | **{v9['delta_ic']:.4f}** |",
              "",
              f"The point estimate is encouraging but deliberately modest: v9 beats the zero-return baseline by **{v9['rmse_skill_vs_zero']:+.2%} RMSE skill** in this single 2026 SPY holdout. Its direction head is {payload['direction_head_accuracy']:.2%} accurate and its nominal 80% interval covers {payload['interval_80_coverage']:.2%} of test returns, so the uncertainty head is currently **under-calibrated**.",
              "",
              "This is a worked example, not evidence of a persistent trading edge. The next requirement is to run the same v9 protocol across the multi-asset/multi-regime arena.",
              "",
          ])
          nb = nbformat.read(notebook, as_version=4)
          nb.cells[0].source = summary
          nbformat.write(nb, notebook)
          PY

      - name: Validate executed outputs
        run: |
          python - <<'PY'
          import json
          import nbformat
          from pathlib import Path

          notebook = Path("examples/notebooks/v9_return_forecasting.ipynb")
          nb = nbformat.read(notebook, as_version=4)
          nbformat.validate(nb)
          code_cells = [cell for cell in nb.cells if cell.cell_type == "code"]
          assert code_cells
          assert all(cell.execution_count is not None for cell in code_cells)
          assert not any(
              output.output_type == "error"
              for cell in code_cells
              for output in cell.get("outputs", [])
          )
          png_outputs = sum(
              1
              for cell in code_cells
              for output in cell.get("outputs", [])
              if output.output_type in {"display_data", "execute_result"}
              and "image/png" in output.get("data", {})
          )
          assert png_outputs >= 3, f"Expected at least 3 embedded charts, found {png_outputs}"

          metrics = Path("reports/generated/v9-notebook/v9_spy_metrics.json")
          assert metrics.exists()
          payload = json.loads(metrics.read_text())
          assert payload["test_samples"] > 100
          assert len(payload["forecast_metrics"]) == 3
          print(f"Embedded PNG outputs: {png_outputs}")
          print(json.dumps(payload, indent=2))
          PY

      - name: Render HTML
        run: |
          mkdir -p notebook-artifact
          jupyter nbconvert             --to html             examples/notebooks/v9_return_forecasting.ipynb             --output v9_return_forecasting.html             --output-dir notebook-artifact
          cp examples/notebooks/v9_return_forecasting.ipynb notebook-artifact/
          cp examples/data/v9_spy_2015_2026.csv notebook-artifact/
          cp reports/generated/v9-notebook/v9_spy_metrics.json notebook-artifact/

      - name: Commit executed notebook and frozen data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/notebooks/v9_return_forecasting.ipynb
          git add examples/data/v9_spy_2015_2026.csv
          git add -f reports/generated/v9-notebook/v9_spy_metrics.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add executed v9 return-forecasting notebook"
            git push origin HEAD:architecture-clean-up
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: v9-executed-notebook
          path: notebook-artifact
          if-no-files-found: error
          retention-days: 30
